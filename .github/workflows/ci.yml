name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit + integration tests
        run: pytest -q

      - name: Run evaluation harness (quality/hallucination/latency/cost gates)
        run: python -m app.eval.harness --dataset data/sample/eval_set.jsonl --corpus data/sample/corpus.json

      - name: Build Docker image
        run: docker build -f infra/Dockerfile -t fde-showcase-api:ci .
